set_temperature:
  name: Forcer une température
  description: >-
    Force une température pour une pièce. Sans durée, la surcharge dure jusqu'au
    prochain changement de créneau du planning.
  fields:
    piece:
      name: Pièce
      description: Identifiant de la pièce
      required: true
      example: "bureau"
      selector:
        text:
    temperature:
      name: Température
      description: Consigne à appliquer
      required: true
      example: 20
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duree:
      name: Durée
      description: Durée en minutes (par défaut jusqu'au prochain créneau)
      required: false
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes

reset:
  name: Revenir au planning
  description: Annule la surcharge manuelle et rend la main au planning.
  fields:
    piece:
      name: Pièce
      description: Identifiant de la pièce (toutes les pièces si omis)
      required: false
      example: "bureau"
      selector:
        text:

refresh:
  name: Recalculer
  description: Force un recalcul et une réapplication immédiate des consignes.

set_schedule:
  name: Définir le planning
  description: >-
    Remplace le planning hebdomadaire d'une pièce. Utile pour les automatisations
    et les sauvegardes ; l'édition courante se fait depuis le panneau Chauffage.
  fields:
    piece:
      name: Pièce
      description: Identifiant de la pièce
      required: true
      example: "bureau"
      selector:
        text:
    slots:
      name: Créneaux
      description: >-
        Liste de créneaux {day, start, end, temperature}. day va de 0 (lundi)
        à 6 (dimanche).
      required: true
      example: |
        - day: 0
          start: "07:00"
          end: "09:00"
          temperature: 20
      selector:
        object:
